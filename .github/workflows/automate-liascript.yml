name: LiaScript Export

# Run manually from the Actions tab: it renders the lesson to PDF and a
# SCORM 1.2 package (Moodle / ILIAS) and attaches both to a GitHub Release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write # needed to create the release

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Export lesson (PDF + SCORM)
        run: npm run generate-pdf

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: Practice Course - ${{ inputs.version }}
          body: |
            Automated export of `Test 01.md` (LiaScript).
            - `.pdf`: printable handout
            - `-scorm.zip`: SCORM 1.2 package for Moodle / ILIAS / OPAL
          files: dist/*
